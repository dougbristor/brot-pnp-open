# Intake for claims from brotettes (forks): see ASSIMILATION.md.
# pull_request_target runs this file AS IT IS ON THE BASE BRANCH (its tip when the event fired: github.sha),
# and the judge (assimilate/woodlouse.py) is checked out from that SAME commit. A PR therefore cannot edit its
# own judge or this workflow, and the two always match. (Not from the PR's recorded base.sha: that is the
# base when the PR was opened or last pushed, and goes stale when main moves. On PR #1, 2026-11-01, the new
# workflow ran the old judge from base.sha, which did not know --files, and rejected a good claim.)
# base.sha is used only as the diff's base, to say what the PR changes.
# The PR is never checked out. Its head is fetched into core/ as git objects only (no working tree,
# no hooks, no attributes applied), git diffs it there, and only the head's claims/ tree is unpacked,
# into pr/, for verify to read as data. Nothing from the PR is executed, and the job has read-only
# permissions and no secrets. (actions/checkout refuses a fork's head under pull_request_target, and
# that refusal is kept: first seen on PR #1, the first real fork, 2026-11-01.)
#
# Two jobs, both required on main (Brief 8, M1). `route` says which route the PR is on; `intake`
# runs only for a claims/ PR. A core PR therefore shows intake as SKIPPED, never as a green
# intake: the check no longer reads "verified" for a PR the woodlouse never looked at. GitHub
# counts a skipped required job as passing, so a core PR is held by CODEOWNERS review, not by
# this workflow. `route` must be required too: if it fails, intake is skipped, and only a red
# `route` keeps that PR from merging.
name: assimilate
on:
  pull_request_target:
permissions:
  contents: read
jobs:
  route:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      route: ${{ steps.guard.outputs.route }}
    steps:
      - name: allowed base (the default branch only)
        # The judge below is checked out from the PR's base, and the PR author picks the base.
        # Any other branch could carry a different judge, so only the default branch may judge.
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          DEFAULT: ${{ github.event.repository.default_branch }}
        run: |
          if [ "$BASE_REF" != "$DEFAULT" ]; then
            echo "intake PRs must target $DEFAULT, not $BASE_REF"; exit 1
          fi
      - name: provenance (which workflow and which revisions judged this PR)
        env:
          WORKFLOW_SHA: ${{ github.workflow_sha }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          echo "workflow file from: $WORKFLOW_SHA"
          echo "GITHUB_SHA=$GITHUB_SHA GITHUB_REF=$GITHUB_REF"
          echo "base: $BASE_REF $BASE_SHA   head: $HEAD_REPO $HEAD_SHA"
      - name: judge (the default branch's tip, the same commit as this workflow)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4, pinned by SHA
        with:
          ref: ${{ github.sha }}
          path: core
          fetch-depth: 0
          persist-credentials: false
      - name: PR head (git objects only, never checked out)
        # refs/pull/N/head lives on the base repo for same-repo and fork PRs alike. If the head moved
        # since this event, the sha check fails closed; the new push starts its own run.
        shell: bash
        env:
          PR: ${{ github.event.pull_request.number }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          git -C core fetch --no-tags origin "+refs/pull/${PR}/head:refs/pr/head"
          test "$(git -C core rev-parse refs/pr/head)" = "$HEAD"
      - name: guard (intake or core?)
        id: guard
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: python3 core/assimilate/woodlouse.py route "$BASE" "$HEAD" --repo core
  intake:
    needs: route
    if: needs.route.result == 'success' && needs.route.outputs.route == 'intake'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: judge (the default branch's tip, the same commit as this workflow)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4, pinned by SHA
        with:
          ref: ${{ github.sha }}
          path: core
          fetch-depth: 0
          persist-credentials: false
      - name: PR head (git objects only, never checked out)
        shell: bash
        env:
          PR: ${{ github.event.pull_request.number }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          git -C core fetch --no-tags origin "+refs/pull/${PR}/head:refs/pr/head"
          test "$(git -C core rev-parse refs/pr/head)" = "$HEAD"
      - name: claim files (the head's claims/ tree only, unpacked as data)
        shell: bash
        env:
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          mkdir pr
          git -C core archive --format=tar "$HEAD" claims/ | tar -x --no-same-owner --no-same-permissions -C pr
      - name: woodlouse selftest (every plant must be caught)
        run: python3 core/assimilate/woodlouse.py selftest
      - name: intake (guard, then verify each new claim; a core PR fails here)
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: python3 core/assimilate/woodlouse.py intake "$BASE" "$HEAD" --repo core --files pr --claims-only
